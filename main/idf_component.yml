## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version for multi-target support (ESP32-S3, C3, C5, C6, S2, P4, S31)
  idf:
    version: '>=6.1.0'

  ## cJSON library (managed component in ESP-IDF v6.x)
  espressif/cjson:
    version: '^1.7.18'

  ## High-performance secp256k1 cryptographic engine
  secp256k1:
    path: "../components/secp256k1"

  ## TinyUSB is only supported and required on targets with USB-OTG hardware
  espressif/esp_tinyusb:
    version: '^1.7.2'
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4, esp32s31]"
