## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version for multi-target support (ESP32-S3, C5, P4)
  idf:
    version: '>=5.3.0'

  ## TinyUSB is only supported and required on targets with USB-OTG hardware
  espressif/esp_tinyusb:
    version: '^1.7.2'
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
